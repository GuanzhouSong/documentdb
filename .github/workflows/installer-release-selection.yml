name: Installer release selection

on:
  pull_request:
    paths:
      - packaging/install.sh
      - packaging/test_packages/test-install-script.sh
      - .github/workflows/installer-release-selection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-install:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { image: 'ubuntu:24.04', family: apt, pg: '18' }
          - { image: 'rockylinux:9', family: rpm, pg: '17' }
        version: [stable, v1.0-RC1]
    steps:
      - uses: actions/checkout@v5
      - name: Read stable mirror version
        if: matrix.version == 'stable'
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://documentdb.io/packages/release-info.json |
            jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+-[0-9]+$")) | ltrimstr("v")')
          echo "STABLE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check installer contract
        if: matrix.target.family == 'apt' && matrix.version == 'stable'
        run: bash packaging/test_packages/test-install-script.sh
      - name: Install selected release on a clean native host
        env:
          IMAGE: ${{ matrix.target.image }}
          FAMILY: ${{ matrix.target.family }}
          PG_MAJOR: ${{ matrix.target.pg }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          docker run --rm \
            -v "$PWD/packaging/install.sh:/install.sh:ro" \
            -e FAMILY -e PG_MAJOR -e RELEASE_VERSION -e STABLE_VERSION \
            "$IMAGE" sh -eu -c '
              if [ "$FAMILY" = apt ]; then
                apt-get update
                apt-get install -y curl ca-certificates
              else
                dnf install -y ca-certificates
                command -v curl
              fi
              set -- --yes --packages-only --pg-major "$PG_MAJOR"
              if [ "$RELEASE_VERSION" != stable ]; then
                set -- "$@" --version "$RELEASE_VERSION"
              fi
              sh /install.sh "$@"
              if [ "$RELEASE_VERSION" = stable ]; then
                extension_version="$STABLE_VERSION"
                package_version=$(printf "%s" "$STABLE_VERSION" | tr "-" ".")
              else
                extension_version=1.0-0
                package_version=1.0.0
                test ! -e /etc/apt/sources.list.d/documentdb.list
                test ! -e /etc/yum.repos.d/documentdb.repo
                test "$(cat /etc/documentdb/installer-release-candidate)" = v1.0-RC1
                if sh /install.sh --yes --packages-only --pg-major "$PG_MAJOR"; then
                  echo "Stable mode unexpectedly adopted RC packages" >&2
                  exit 1
                fi
              fi
              if [ "$FAMILY" = apt ]; then
                for package in "documentdb-$PG_MAJOR" documentdb-common \
                    documentdb-postgresql-tools documentdb-gateway; do
                  actual=$(dpkg-query -W -f="\${Version}" "$package")
                  test "$actual" = "$package_version"
                done
                test "$(dpkg-query -W -f="\${Version}" "postgresql-$PG_MAJOR-documentdb")" = "$extension_version"
              else
                for package in "documentdb-$PG_MAJOR" documentdb-common \
                    documentdb-postgresql-tools documentdb-gateway \
                    "postgresql$PG_MAJOR-documentdb"; do
                  test "$(rpm -q --qf "%{VERSION}" "$package")" = "$package_version"
                done
              fi
            '
